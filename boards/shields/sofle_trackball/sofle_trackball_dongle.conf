# === Debug logging (build.yaml adds the zmk-usb-logging snippet) ===
# View with e.g. `sudo tio /dev/tty.usbmodemXXXX` (macOS) after flashing.
CONFIG_LOG_DEFAULT_LEVEL=4

# === Dongle (standalone central, no physical keys/LEDs) ===
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
# 2 peripherals + 4 host profiles
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
# Dongle has no battery of its own
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# No keyboard backlight/RGB on the bare dongle board.
# Display comes from the Prospector adapter shield (prospector_adapter),
# which drives CONFIG_ZMK_DISPLAY=y itself.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# Prospector display stability settings (matches known-working reference).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LV_Z_MEM_POOL_SIZE=49152

# === TEMP MINIMAL-REPRO BUILD ===
# Everything Studio-RPC-related stripped out (Studio itself is also
# disabled via build.yaml's snippet/cmake-args for this test). Only the
# core split-central pieces the shared keymap/devicetree structurally
# need are kept:
#  - RUNTIME_INPUT_PROCESSOR: needed by trackball_listener's
#    mouse_runtime_input_processor reference in the dongle overlay.
#  - RUNTIME_SENSOR_ROTATE: needed by the &rsr_vol behavior the shared
#    keymap binds sensor-bindings to.
#  - SPLIT_RELAY_EVENT(_DATA_LEN): the actual split-transport relay the
#    right peripheral's trackball uses, unrelated to Studio.
# Removed entirely (not referenced by any devicetree node, purely
# Studio-adjacent overhead): ZMK_STUDIO, BLE_MANAGEMENT, SETTINGS_RPC,
# CUSTOM_SETTINGS, FAST_KEYMAP, DEVICE_INFO, WATCHDOG, RUNTIME_MACRO,
# RUNTIME_COMBO, and all their *_STUDIO_RPC companions + RPC buffer/
# thread-stack sizing.
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY_HISTORY=n

CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
