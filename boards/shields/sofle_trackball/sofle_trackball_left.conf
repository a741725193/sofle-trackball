CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y



CONFIG_ZMK_POINTING=y



CONFIG_ZMK_USB=n

# === Peripheral display: GATT client to subscribe to central status (Peripheral only) ===
CONFIG_BT_GATT_CLIENT=y

# Custom Settings relay so the central can read/write settings on this peripheral.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Display thread needs much more than the default 2 KB for LVGL render +
# vcom driver DMA path.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=32768

# This shield's Kconfig.defconfig defaults CONFIG_SSD1306=y whenever
# ZMK_DISPLAY is on (leftover from before this project used the LS013), and
# ZMK core defaults ZMK_DISPLAY_BLANK_ON_IDLE=y whenever SSD1306 is set --
# so idle-blanking was silently active. The display's own LVGL tick (and
# thus all peripheral-display widget updates) only run while ZMK considers
# this half "active"; each half tracks activity from its own local kscan
# only (no cross-half relay), so typing on the other half never resets
# this half's idle timer. Confirmed as the cause of the "freeze": this half
# would go idle ~CONFIG_ZMK_IDLE_TIMEOUT after boot if its own keys aren't
# touched, silently pausing the display. Disabled so the peripheral display
# stays live regardless of which half is being typed on.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n