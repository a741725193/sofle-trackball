CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y



CONFIG_ZMK_POINTING=y



CONFIG_ZMK_USB=n

# === Peripheral display: GATT client to subscribe to central status (Peripheral only) ===
CONFIG_BT_GATT_CLIENT=y

# Custom Settings relay so the central can read/write settings on this peripheral.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Display thread needs much more than the default 2 KB for LVGL render +
# vcom driver DMA path. Without this, LVGL flush silently corrupts frames.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384