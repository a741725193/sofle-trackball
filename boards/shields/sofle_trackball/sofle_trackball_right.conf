CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_POINTING=y

CONFIG_ZMK_USB=n

CONFIG_BT_BAS=y

# === Display / Backlight / RGB underglow (this half has the hardware) ===
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# === Trackball (PAW3222, physically on this peripheral half) ===
# Relayed to the dongle central via zmk,input-split (trackball_split), no Studio RPC here.
CONFIG_PAW3222=y
# Registers cpi/force_awake as custom settings (subsystem "cormoran__paw3222"),
# relayed to the dongle by CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY below.
CONFIG_ZMK_PAW3222_CUSTOM_SETTINGS=y

# Custom Settings relay so the central can read/write settings on this peripheral.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
