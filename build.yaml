include:
  - board: eyelash_nano
    shield: sofle_trackball_left nice_view
  - board: eyelash_nano
    shield: sofle_trackball_right nice_view
  - board: eyelash_nano
    # prospector_adapter removed: its eyelash_nano pin mapping (from an
    # unverified WIP branch of tokyo2006/prospector-zmk-module) hangs
    # the board at a very early, pre-USB stage. Re-add once the correct
    # pinout for the physical Prospector-on-eyelash_nano wiring is known.
    shield: sofle_trackball_dongle
    snippet: studio-rpc-usb-uart zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: eyelash_nano
    shield: settings_reset
