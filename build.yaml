include:
  # ---------------------------------------------------------------------------
  # Normal split: right half is the central.
  # ---------------------------------------------------------------------------
  # Left half: LS013 + peripheral-display OPERATOR theme (central status).
  - board: eyelash_nano
    shield: sofle_trackball_left peripheral_lcd_ls013
    snippet: display-left display-left-operator
    artifact-name: sofle_trackball_left-display-operator

  # Right half: TPS43 trackpad + forward status to the left display + Studio.
  - board: eyelash_nano
    shield: sofle_trackball_right
    snippet: studio-rpc-usb-uart trackpad-tps43 trackpad-tps43-central peripheral-display-central
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: sofle_trackball_right-tps43-display

  # Right half: PAW3222 trackball + forward status to the left display + Studio.
  - board: eyelash_nano
    shield: sofle_trackball_right
    snippet: studio-rpc-usb-uart trackball-paw3222 trackball-paw3222-central peripheral-display-central
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: sofle_trackball_right-trackball-display

  # ---------------------------------------------------------------------------
  # Dongle mode: dongle is central; both halves are peripherals.
  # ---------------------------------------------------------------------------
  # Dongle central with Prospector display.
  - board: nice_nano@2.0.0//zmk
    shield: sofle_trackball_dongle prospector_adapter
    snippet: studio-rpc-usb-uart dongle-central
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: sofle_trackball_dongle-nice_nano
  - board: xiao_ble//zmk
    shield: sofle_trackball_dongle prospector_adapter
    snippet: studio-rpc-usb-uart dongle-central
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: sofle_trackball_dongle-xiao_ble

  # Left peripheral: LS013 + Rolio peripheral screen (local battery/link/art only).
  - board: eyelash_nano
    shield: sofle_trackball_left sofle_rolio_screen
    snippet: display-left
    artifact-name: sofle_trackball_left-rolio-screen

  # Right peripheral: TPS43 relayed to the dongle central.
  - board: eyelash_nano
    shield: sofle_trackball_right
    snippet: trackpad-tps43 trackpad-tps43-peripheral peripheral-right
    artifact-name: sofle_trackball_right-tps43-peripheral

  # Right peripheral: PAW3222 relayed to the dongle central.
  - board: eyelash_nano
    shield: sofle_trackball_right
    snippet: trackball-paw3222 trackball-paw3222-peripheral peripheral-right
    artifact-name: sofle_trackball_right-trackball-peripheral

  - board: eyelash_nano
    shield: settings_reset
    artifact-name: settings_reset
