# Peripheral right in dongle mode: no USB/Studio and no central-only features.
# Input is relayed through zmk,input-split; settings use the split relay.
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_BLE_MANAGEMENT=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_BAS=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# Central-only feature modules are not used on this half.
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=n
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=n
CONFIG_ZMK_RUNTIME_MACRO=n
CONFIG_ZMK_RUNTIME_COMBO=n
CONFIG_ZMK_FAST_KEYMAP=n
CONFIG_ZMK_DEVICE_INFO=n
CONFIG_ZMK_WATCHDOG=n

CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_INPUT_THREAD_STACK_SIZE=4096
