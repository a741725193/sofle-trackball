# === Peripheral display: GATT client to subscribe to central status (Peripheral only) ===
CONFIG_BT_GATT_CLIENT=y

# Display thread needs much more than the default 2 KB for LVGL render +
# vcom driver DMA path.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=32768

# The left half tracks activity from its own local kscan only, so blanking on
# idle would freeze the display when only the right half is being typed on.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Fixed OPERATOR theme for the 128x128 mono panel.
CONFIG_ZMK_PERIPHERAL_DISPLAY_THEME_OPERATOR=y
CONFIG_ZMK_PERIPHERAL_DISPLAY_WIDGET_BONGO_CAT=n
